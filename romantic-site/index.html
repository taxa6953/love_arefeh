<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>برای تو ❤️</title>

<link rel="stylesheet" href="../romantic-site/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="floating-hearts"></div>
<div class="stars"></div>

<div class="glass-box">

    <h1 id="typing"></h1>

    <button id="startBtn">
        شروع سفر
        <img src="../romantic-site/IMG_6026.png" alt="قلب" class="button-heart">
    </button>

</div>


<div id="memories" class="memories">

    <div class="memory-card">

        <img src="photo1.jpg">

        <h2>اولین آشنایی 🌹</h2>

        <p>
            از همینجا همه چیز شروع شد...
        </p>

    </div>


    <div class="memory-card">

        <img src="photo2.jpg">

        <h2>اولین خنده 😊</h2>

        <p>
            لبخندی که هنوز توی ذهنم مانده...
        </p>

    </div>


    <div class="memory-card">

        <img src="photo3.jpg">

        <h2>یک خاطره خاص ❤️</h2>

        <p>
            بعضی لحظه‌ها هیچوقت فراموش نمی‌شوند...
        </p>

    </div>

</div>

<div id="heartGame" class="heart-game">

    <div class="game-box">

        <h1>یه بازی کوچولو ❤️</h1>

        <p>
            10 تا قلب رو جمع کن تا به مرحله بعد برسیم
        </p>

        <div id="score">
            0 / 10
        </div>

    </div>

</div>
    
<div id="loveScene" class="love-scene">
<div id="galaxyHeart" class="galaxy-heart"></div>
 <div class="big-heart" id="bigHeart">
        <img src="../romantic-site/IMG_6027.png" alt="قلب">
    </div>

    <div class="love-text">

        <h1>از بین میلیاردها آدم...</h1>

        <h2>انتخاب من تو بودی ❤️</h2>

    </div>

    <button id="continueBtn">
        ادامه ❤️
    </button>

</div>


<script src="../romantic-site/script.js"></script>

</body>
</html>
